# Zigbee2MQTT instance listesi — tek doğruluk kaynağı.
# Bu dosya değişince: python tools/sync_z2m.py  (z2m_<id>/ klasörlerini yeniden üretir)
#
# id         : add-on slug'ı z2m_<id> olur. Sadece küçük harf, rakam, "_".
#              Kurulumdan sonra DEĞİŞTİRME (değişirse HA bunu yeni bir add-on sayar).
# name       : HA Apps listesinde görünen isim.
# data_path  : Z2M verisinin durduğu /config altındaki klasör (configuration.yaml,
#              database.db, coordinator_backup.json). Mevcut kurulumlarda klasör adı birebir aynı kalmalı.
# socat_port : add-on'un 8485/tcp portunun host'taki karşılığı. Her instance'ta farklı olmalı.
# dongle_ip  : sadece bilgi amaçlı (seri bağlantı data_path içindeki configuration.yaml'da tanımlı).

