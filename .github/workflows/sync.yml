name: Sync Z2M

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # her pazartesi 05:00 UTC

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - run: python tools/sync_z2m.py

      - name: Değişiklik varsa commit + push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Değişiklik yok."
            exit 0
          fi
          version=$(python -c "import json,glob; print(json.load(open(sorted(glob.glob('z2m_*/config.json'))[0], encoding='utf-8'))['version'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: upstream Zigbee2MQTT $version sürümüyle senkronlandı"
          git push
